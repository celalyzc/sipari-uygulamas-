<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divan Restoran v12 - Operasyon Modu</title>
    <style>
        :root { 
            --ana-renk: #e67e22; 
            --bos-renk: #2c3e50; 
            --mutfakta-renk: #d35400; 
            --hazir-renk: #27ae60; 
            --gecikme-renk: #c0392b;
            --arka-plan: #0f0f0f; 
        }
        
        body { font-family: 'Segoe UI', sans-serif; background: var(--arka-plan); color: #fff; margin: 0; padding: 10px; box-sizing: border-box; }
        
        /* MASA HARİTASI */
        .masa-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .masa-kart {
            height: 120px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            border: 2px solid rgba(255,255,255,0.1);
            background: var(--bos-renk);
        }

        .masa-kart.dolu { background: var(--mutfakta-renk); animation: pulse 2s infinite; }
        .masa-kart.hazir { background: var(--hazir-renk); box-shadow: 0 0 20px var(--hazir-renk); }
        .masa-kart.gecikmis { background: var(--gecikme-renk); animation: shake 0.5s infinite; }

        .masa-no { font-size: 20px; font-weight: bold; }
        .masa-sure { font-size: 12px; margin-top: 5px; opacity: 0.8; }

        /* SİPARİŞ PANELİ (MODAL GİBİ) */
        .siparis-panel {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 80%;
            background: #1a1a1a; border-top: 3px solid var(--ana-renk);
            border-radius: 20px 20px 0 0; display: none; flex-direction: column; z-index: 100;
        }

        .urun-listesi { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 15px; overflow-y: auto; }
        .urun-item { background: #252525; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #333; }
        .urun-item:active { background: var(--ana-renk); }

        .alt-menu { padding: 20px; display: flex; gap: 10px; background: #111; }
        .btn { flex: 1; padding: 15px; border-radius: 8px; border: none; font-weight: bold; color: white; cursor: pointer; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.8; } 100% { opacity: 1; } }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(3px); } 50% { transform: translateX(-3px); } 100% { transform: translateX(0); } }

        .header { text-align: center; padding: 10px; color: var(--ana-renk); font-weight: bold; font-size: 20px; }
        .ozet-alan { background: #1a1a1a; padding: 10px; border-radius: 10px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="header">🚀 DİVAN OPERASYON MERKEZİ</div>

<div id="masaHaritasi" class="masa-grid"></div>

<div class="ozet-alan">
    <h3 style="margin-top:0; color:var(--ana-renk)">🔥 Mutfak Durumu</h3>
    <div id="mutfakListesi">Henüz bekleyen sipariş yok.</div>
</div>

<div id="siparisPanel" class="siparis-panel">
    <div class="header" id="panelMasaBaslik">MASA X - SİPARİŞ AL</div>
    <div class="urun-listesi" id="menuAlan"></div>
    <div class="alt-menu">
        <button class="btn" style="background:#555" onclick="panelKapat()">İPTAL</button>
        <button class="btn" style="background:var(--ana-renk)" onclick="mutfagaGonder()">USTAYA GÖNDER 👨‍🍳</button>
    </div>
</div>

<script>
    const Masalar = ["Masa 1", "Masa 2", "Masa 3", "Masa 4", "Masa 5", "Masa 6", "Masa 7", "Masa 8", "Personel", "VİP"];
    const Menu = ["Acılı Lahmacun", "Kıymalı Pide", "Kuşbaşılı", "Adana Menü", "Tavuk Şiş", "Ayran", "Kola"];
    
    let aktifSiparisler = JSON.parse(localStorage.getItem("divan_v12_aktif")) || {};
    let seciliMasa = null;
    let tempSepet = {};

    function init() {
        haritaCiz();
        setInterval(sureGuncelle, 10000); // 10 saniyede bir süreleri ve renkleri kontrol et
    }

    function haritaCiz() {
        const h = document.getElementById("masaHaritasi");
        h.innerHTML = "";
        Masalar.forEach(m => {
            const s = aktifSiparisler[m];
            let classEk = "";
            let sureYazisi = "Boş";

            if(s) {
                const gecenDakika = Math.floor((new Date() - new Date(s.saat)) / 60000);
                sureYazisi = gecenDakika + " dk önce";
                classEk = s.durum === "hazir" ? "hazir" : (gecenDakika > 15 ? "gecikmis" : "dolu");
            }

            h.innerHTML += `
                <div class="masa-kart ${classEk}" onclick="masaTikla('${m}')">
                    <div class="masa-no">${m}</div>
                    <div class="masa-sure">${sureYazisi}</div>
                </div>
            `;
        });
        mutfakListesiGuncelle();
    }

    function masaTikla(m) {
        if (aktifSiparisler[m]) {
            if (aktifSiparisler[m].durum === "hazir") {
                if(confirm(m + " siparişini teslim ettin mi?")) {
                    delete aktifSiparisler[m];
                    kaydet();
                }
            } else {
                if(confirm(m + " siparişi HAZIR MI? (Usta bitirdi mi?)")) {
                    aktifSiparisler[m].durum = "hazir";
                    kaydet();
                }
            }
        } else {
            seciliMasa = m;
            tempSepet = {};
            document.getElementById("panelMasaBaslik").innerText = m + " - SİPARİŞ AL";
            menuCiz();
            document.getElementById("siparisPanel").style.display = "flex";
        }
    }

    function menuCiz() {
        const mAlan = document.getElementById("menuAlan");
        mAlan.innerHTML = "";
        Menu.forEach(u => {
            mAlan.innerHTML += `
                <div class="urun-item" onclick="sepeteEkle('${u}')">
                    ${u} <br> <b id="adet-${u}">${tempSepet[u] || 0}</b>
                </div>
            `;
        });
    }

    function sepeteEkle(u) {
        tempSepet[u] = (tempSepet[u] || 0) + 1;
        document.getElementById("adet-"+u).innerText = tempSepet[u];
    }

    function mutfagaGonder() {
        if(Object.keys(tempSepet).length === 0) return alert("Ürün seçmedin!");
        aktifSiparisler[seciliMasa] = {
            urunler: {...tempSepet},
            saat: new Date(),
            durum: "mutfakta"
        };
        kaydet();
        panelKapat();
    }

    function mutfakListesiGuncelle() {
        const l = document.getElementById("mutfakListesi");
        let html = "";
        for(let m in aktifSiparisler) {
            const s = aktifSiparisler[m];
            const uList = Object.entries(s.urunler).map(([u, a]) => `${a}x ${u}`).join(", ");
            html += `<div style="padding:5px 0; border-bottom:1px solid #333; color:${s.durum==='hazir'?'#27ae60':'#e67e22'}">
                <b>${m}:</b> ${uList} <small>(${s.durum})</small>
            </div>`;
        }
        l.innerHTML = html || "Bekleyen sipariş yok.";
    }

    function sureGuncelle() { haritaCiz(); }
    function panelKapat() { document.getElementById("siparisPanel").style.display = "none"; }
    function kaydet() {
        localStorage.setItem("divan_v12_aktif", JSON.stringify(aktifSiparisler));
        haritaCiz();
    }

    init();
</script>
</body>
</html>
