<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Divan Garson v13</title>
    <style>
        :root { 
            --ana-renk: #e67e22; 
            --bos-renk: #2c3e50; 
            --mutfakta-renk: #d35400; 
            --hazir-renk: #27ae60; 
            --gecikme-renk: #c0392b;
            --arka-plan: #000; 
        }
        
        body { font-family: 'Segoe UI', sans-serif; background: var(--arka-plan); color: #fff; margin: 0; padding: 10px; overflow-x: hidden; }
        
        /* MOBİL MASA GRID: Yan yana 3 masa */
        .masa-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .masa-kart {
            height: 90px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            background: var(--bos-renk);
            text-align: center;
        }

        .masa-kart.dolu { background: var(--mutfakta-renk); }
        .masa-kart.hazir { background: var(--hazir-renk); box-shadow: 0 0 15px var(--hazir-renk); }
        .masa-kart.gecikmis { background: var(--gecikme-renk); animation: shake 0.5s infinite; }

        .masa-no { font-size: 16px; font-weight: bold; }
        .masa-sure { font-size: 10px; margin-top: 4px; opacity: 0.7; }

        /* NOT DEFTERİ PANELİ */
        .siparis-panel {
            position: fixed; top: 10%; left: 5%; width: 90%; height: auto;
            background: #1a1a1a; border: 2px solid var(--ana-renk);
            border-radius: 15px; display: none; flex-direction: column; z-index: 1000;
            padding: 15px; box-sizing: border-box;
        }

        .not-alani {
            width: 100%; height: 150px; background: #333; color: #fff;
            border: 1px solid #444; border-radius: 8px; padding: 10px;
            font-size: 18px; margin-bottom: 15px; box-sizing: border-box;
            resize: none;
        }

        .btn-grup { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 15px; border-radius: 8px; border: none; font-weight: bold; color: white; font-size: 14px; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(2px); } 75% { transform: translateX(-2px); } }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 999; }
        .header { text-align: center; padding: 5px 0 15px 0; color: var(--ana-renk); font-weight: bold; }
    </style>
</head>
<body>

<div class="header">📋 DİVAN NOT DEFTERİ MODU</div>

<div id="masaHaritasi" class="masa-grid"></div>

<div id="overlay" class="overlay" onclick="panelKapat()"></div>

<div id="siparisPanel" class="siparis-panel">
    <h3 id="panelBaslik" style="margin-top:0; color:var(--ana-renk)">Masa X</h3>
    <textarea id="siparisNotu" class="not-alani" placeholder="Siparişi buraya yaz kanka..."></textarea>
    <div class="btn-grup">
        <button class="btn" style="background:#555" onclick="panelKapat()">İPTAL</button>
        <button class="btn" style="background:var(--ana-renk)" onclick="notuKaydet()">KAYDET ✅</button>
    </div>
</div>

<script>
    // 1-13 arası masalar + Personel
    const Masalar = [];
    for(let i=1; i<=13; i++) Masalar.push("Masa " + i);
    Masalar.push("Personel");
    
    let aktifSiparisler = JSON.parse(localStorage.getItem("divan_v13_notlar")) || {};
    let seciliMasa = null;

    function init() {
        haritaCiz();
        setInterval(haritaCiz, 30000); // 30 saniyede bir süreleri tazele
    }

    function haritaCiz() {
        const h = document.getElementById("masaHaritasi");
        h.innerHTML = "";
        Masalar.forEach(m => {
            const s = aktifSiparisler[m];
            let classEk = "";
            let altYazi = "Boş";

            if(s) {
                const gecenDakika = Math.floor((new Date() - new Date(s.saat)) / 60000);
                altYazi = gecenDakika + " dk / " + s.not.substring(0, 15) + "...";
                
                if(s.durum === "hazir") classEk = "hazir";
                else if(gecenDakika > 20) classEk = "gecikmis";
                else classEk = "dolu";
            }

            h.innerHTML += `
                <div class="masa-kart ${classEk}" onclick="masaTikla('${m}')">
                    <div class="masa-no">${m}</div>
                    <div class="masa-sure">${altYazi}</div>
                </div>
            `;
        });
    }

    function masaTikla(m) {
        seciliMasa = m;
        const s = aktifSiparisler[m];

        if (!s) {
            // Masa Boş: Not Defterini Aç
            document.getElementById("panelBaslik").innerText = m + " - Yeni Sipariş";
            document.getElementById("siparisNotu").value = "";
            panelAc();
        } else if (s.durum === "mutfakta") {
            // Mutfakta: Hazır mı veya Düzenle mi?
            let islem = confirm(m + " İÇİN İŞLEM SEÇ:\n\nTAMAM: Sipariş Hazır (Yeşil Yap)\nİPTAL: Notu Düzenle");
            if(islem) {
                s.durum = "hazir";
                kaydet();
            } else {
                document.getElementById("panelBaslik").innerText = m + " - Düzenle";
                document.getElementById("siparisNotu").value = s.not;
                panelAc();
            }
        } else if (s.durum === "hazir") {
            // Hazır: Teslim edildi mi?
            if(confirm(m + " teslim edildi mi? (Masa Boşalacak)")) {
                delete aktifSiparisler[m];
                kaydet();
            }
        }
    }

    function notuKaydet() {
        const not = document.getElementById("siparisNotu").value;
        if(!not.trim()) return alert("Bir şeyler yaz kanka!");
        
        aktifSiparisler[seciliMasa] = {
            not: not,
            saat: new Date(),
            durum: "mutfakta"
        };
        kaydet();
        panelKapat();
    }

    function panelAc() {
        document.getElementById("siparisPanel").style.display = "flex";
        document.getElementById("overlay").style.display = "block";
        document.getElementById("siparisNotu").focus();
    }

    function panelKapat() {
        document.getElementById("siparisPanel").style.display = "none";
        document.getElementById("overlay").style.display = "none";
    }

    function kaydet() {
        localStorage.setItem("divan_v13_notlar", JSON.stringify(aktifSiparisler));
        haritaCiz();
    }

    init();
</script>
</body>
</html>
